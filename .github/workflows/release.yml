name: release

# Pushing a version tag (git tag v0.5.0 && git push origin v0.5.0) checks the
# commit (reusing its pull request's ci run when that run checked the same
# code), publishes a GitHub Release with the binary, deploys it to the droplet
# and purges Cloudflare's cache (PLAN.md §18.5).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The tag goes on a pull request's squash-merge. That pull request's ci run
  # recorded the tree it checked (its head merged into main); when it matches
  # the tagged commit's tree, the run already checked this exact code.
  pr-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reuse() { echo "$1"; echo "passed=true" >> "$GITHUB_OUTPUT"; exit 0; }
          check() { echo "$1; running the checks here."; echo "passed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" -q .tree.sha) || check "Couldn't read $GITHUB_SHA"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" -q '[.[] | select(.merged_at != null)][0].number // empty') || pr=""
          [ -n "$pr" ] || check "No merged pull request for $GITHUB_SHA"
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" -q .head.sha) || check "Couldn't read #$pr"
          # Newest first: a later run may have checked the head against a newer main.
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --event pull_request --commit "$head" \
              --status success --limit 10 --json databaseId -q '.[].databaseId' || true); do
            dir=$(mktemp -d)
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n tested-tree -D "$dir" 2>/dev/null || continue
            if [ "$(cat "$dir/tested-tree")" = "$tree" ]; then
              reuse "ci run $id for #$pr checked tree $tree; reusing it."
            fi
          done
          check "No passing ci run for #$pr checked tree $tree"

  ci:
    needs: pr-ci
    if: needs.pr-ci.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [pr-ci, ci]
    # ci is skipped when the pull request's run was reused.
    if: ${{ !cancelled() && (needs.pr-ci.outputs.passed == 'true' || needs.ci.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the catalog date and commit come from git history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: |
          make build VERSION="$GITHUB_REF_NAME"
          test "$(./bin/doiomad version)" = "$GITHUB_REF_NAME"
          cp bin/doiomad doiomad-linux-amd64
          sha256sum doiomad-linux-amd64 > doiomad-linux-amd64.sha256
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" doiomad-linux-amd64 doiomad-linux-amd64.sha256 --verify-tag --generate-notes

  deploy:
    needs: release
    # Without this, a skipped ci job (the pull request's run was reused) skips the deploy too.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p 'doiomad-linux-amd64*'
          sha256sum -c doiomad-linux-amd64.sha256
      - name: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          sum=$(cut -d' ' -f1 doiomad-linux-amd64.sha256)
          # The deploy key's forced command installs the binary, switches to it and
          # rolls back on its own if /healthz doesn't report the new version.
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "deploy@$DEPLOY_HOST" \
            "install $GITHUB_REF_NAME $sum" < doiomad-linux-amd64
      - name: purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_CACHE_TOKEN: ${{ secrets.CF_CACHE_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ]; then echo "Cloudflare not configured yet; skipping"; exit 0; fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_CACHE_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq -e .success
