name: release

# Pushing a version tag (git tag v0.5.0 && git push origin v0.5.0) checks the
# commit (reusing main's ci run for it when there is one), publishes a GitHub
# Release with the binary, deploys it to the droplet and purges Cloudflare's
# cache (PLAN.md §18.5).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The tag is pushed right after merging to main, whose push already runs
  # every check on this exact commit. Wait for that run and reuse its result
  # instead of checking the same code twice.
  main-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=""
          for i in $(seq 1 12); do # main's run can take a few seconds to appear
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" \
              --json databaseId -q '.[0].databaseId')
            [ -n "$id" ] && break
            sleep 5
          done
          if [ -z "$id" ]; then
            echo "No ci run on main for $GITHUB_SHA; running the checks here."
            echo "passed=false" >> "$GITHUB_OUTPUT"
          elif gh run watch "$id" -R "$GITHUB_REPOSITORY" --interval 15 --exit-status > /dev/null; then
            echo "ci run $id passed for $GITHUB_SHA; reusing it."
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ci run $id did not pass; running the checks here."
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: main-ci
    if: needs.main-ci.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [main-ci, ci]
    # ci is skipped when main's run was reused.
    if: ${{ !cancelled() && (needs.main-ci.outputs.passed == 'true' || needs.ci.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the catalog date and commit come from git history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: |
          make build VERSION="$GITHUB_REF_NAME"
          test "$(./bin/doiomad version)" = "$GITHUB_REF_NAME"
          cp bin/doiomad doiomad-linux-amd64
          sha256sum doiomad-linux-amd64 > doiomad-linux-amd64.sha256
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" doiomad-linux-amd64 doiomad-linux-amd64.sha256 --verify-tag --generate-notes

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p 'doiomad-linux-amd64*'
          sha256sum -c doiomad-linux-amd64.sha256
      - name: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          sum=$(cut -d' ' -f1 doiomad-linux-amd64.sha256)
          # The deploy key's forced command installs the binary, switches to it and
          # rolls back on its own if /healthz doesn't report the new version.
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "deploy@$DEPLOY_HOST" \
            "install $GITHUB_REF_NAME $sum" < doiomad-linux-amd64
      - name: purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_CACHE_TOKEN: ${{ secrets.CF_CACHE_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ]; then echo "Cloudflare not configured yet; skipping"; exit 0; fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_CACHE_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq -e .success
