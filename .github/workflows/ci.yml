name: ci

# Every change reaches main through a pull request, so its run is the check.
# A release reuses that run when the tagged commit holds the code it tested.
on:
  pull_request:
    paths-ignore: ["**.md"]
  workflow_call: # the release workflow runs the checks when no pull request run can be reused

permissions:
  contents: read

# A newer push to the same pull request cancels the run still checking the
# old commit. A release's checks are keyed by commit and run to the end.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o bin/doiomad ./cmd/doiomad
      - name: validate catalog
        run: ./bin/doiomad validate
      # The tree this run checked (for a pull request, its head merged into
      # main). A release whose commit has the same tree reuses this run.
      - name: record tree
        run: git rev-parse 'HEAD^{tree}' > tested-tree
      - uses: actions/upload-artifact@v7
        with:
          name: tested-tree
          path: tested-tree
          retention-days: 90

  # Accessibility (axe-core) and layout checks against a running server, at
  # phone and desktop widths and in every theme (PLAN.md §17.5).
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/uicheck/package-lock.json
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o bin/doiomad ./cmd/doiomad
      - name: start server
        run: |
          ./bin/doiomad serve -demo -admin-insecure -db "$RUNNER_TEMP/ui.db" -addr 127.0.0.1:8080 &
          for i in $(seq 1 50); do curl -fs 127.0.0.1:8080/healthz && exit 0; sleep 0.2; done; exit 1
      - name: install checker
        working-directory: tools/uicheck
        run: npm ci --no-audit --no-fund
      - name: accessibility and layout
        working-directory: tools/uicheck
        env:
          BASE: http://127.0.0.1:8080
        run: CHROME="$(command -v google-chrome || command -v chromium)" node check.mjs
