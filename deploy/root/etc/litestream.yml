# Continuous replication of the DoesItOmarchy database to Cloudflare R2.
# Credentials come from /etc/doiomad/litestream.env.
snapshot:
  interval: 24h
  retention: 720h # 30 days

dbs:
  - path: /var/lib/doiomad/doesitomarchy.db
    replica:
      type: s3
      bucket: ${LITESTREAM_BUCKET}
      # "live/" since 2026-10-01: the original "doesitomarchy.db" path was
      # written to by a restore-rehearsal spare and is no longer used.
      path: live/doesitomarchy.db
      endpoint: ${LITESTREAM_ENDPOINT}
      region: auto
      access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
      secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
