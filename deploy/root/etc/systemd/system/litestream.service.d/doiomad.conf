# Run Litestream as the database owner, with the R2 credentials from
# /etc/doiomad/litestream.env (see deploy/RUNBOOK.md).
[Unit]
ConditionPathExists=/etc/doiomad/litestream.env

[Service]
User=doiomad
Group=doiomad
EnvironmentFile=/etc/doiomad/litestream.env
UMask=0027
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/doiomad
ProtectHome=yes
PrivateTmp=yes
