# Golden search queries (PLAN.md §16.6). Keys:
#   exactly: the result set, any order     first: the top result
#   top: the first N results, any order    contains / excludes: subset checks
#   order: exact result order              line: every result is in this line
#   configs: Mac → exactly these matched configs are listed (AllConfigs false)
#   none: no results                       error: an error chip containing this text
#   suggest: the did-you-mean must be non-empty (true) or empty (false)
# Identifiers are quoted: YAML would otherwise split them at the comma.

# ── nicknames and product lines ──
- q: mbp 2011
  exactly: ["MacBookPro8,1", "MacBookPro8,2", "MacBookPro8,3"]
- q: mba 2013
  exactly: ["MacBookAir6,1", "MacBookAir6,2"]
- q: 2009 imac
  exactly: ["iMac9,1", "iMac10,1", "iMac11,1"]
- q: mbp 15 2012
  exactly: ["MacBookPro9,1", "MacBookPro10,1"]
- q: imac 27 5k 2017
  exactly: ["iMac18,3", "iMacPro1,1"]   # "imac" matches the family (see #11); both are 27-inch 5K 2017
- q: trash can
  first: "MacPro6,1"
- q: trashcan
  first: "MacPro6,1"
- q: cheese grater
  exactly: ["MacPro1,1", "MacPro2,1", "MacPro3,1", "MacPro4,1", "MacPro5,1", "MacPro7,1"]
- q: mac mini 2012
