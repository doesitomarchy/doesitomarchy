          "MacBookAir8,2", "MacBookPro15,4", "MacBookPro15,1", "MacBookPro15,2", "MacBookPro15,3",
          "MacBookAir8,1", "MacBook10,1", "MacBookPro14,1", "MacBookPro14,2", "MacBookPro14,3",
          "MacBookPro13,1", "MacBookPro13,2", "MacBookPro13,3", "MacBook9,1", "MacBookPro11,4",
          "MacBookPro11,5", "MacBook8,1", "MacBookPro12,1", "MacBookPro11,1", "MacBookPro11,2",
          "MacBookPro11,3", "MacBookPro10,1", "MacBookPro10,2"]
- q: macbook 12
  exactly: ["MacBook8,1", "MacBook9,1", "MacBook10,1"]
- q: imac pro
