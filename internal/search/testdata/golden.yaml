- q: mini server
  exactly: ["Macmini3,1", "Macmini4,1", "Macmini5,3", "Macmini6,2"]
  configs:
    "Macmini3,1": [macmini3-1-late-2009-server]
    "Macmini4,1": [macmini4-1-mid-2010-server]
- q: retina macbook
