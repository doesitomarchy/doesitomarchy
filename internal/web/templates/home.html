{{define "content"}}
<div class="hero">
  <h1>does your intel mac run <span class="q">omarchy?</span></h1>
  <div class="coverage">{{template "coverage-rows" .Site}}</div>
  {{template "searchbox" .Data}}
  <p class="hints">Try <a href="{{query "mbp 2015"}}"><code>mbp 2015</code></a>, <a href="{{query "imac 27 5k"}}"><code>imac 27 5k</code></a>,

    or a hardware ID from <code>lspci -nn</code> like <a href="{{query "10de:0647"}}"><code>10de:0647</code></a>. Press <kbd>Ctrl K</kbd> anywhere to search.</p>
</div>
{{end}}
