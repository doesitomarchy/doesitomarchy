# Public API changelog, newest first. Shown at the end of /api.
# Each entry: date (YYYY-MM-DD), title, summary, and optional notes;
# `backticks` mark code.
# Add an entry with every release that changes the API or the report format;
# site pages (even API-related ones, like /api/register) don't belong here.

- date: "2026-10-09"
  title: Live boots, challenges and the catalog snapshot
  summary: "Reports can come from a live boot, such as OmaBoot? Live: they send `\"context\": \"live\"`, and each criterion's new `live` flag (`yes`, `no` or `t2`) says whether a live boot can decide it. The rest go as `not_tested` with the new reason `live-limit`; a live result for them is rejected. All new fields are optional, so existing reports and tools are unchanged."
  notes:
    - "Report format: a new method, `challenge` (the tool showed or played a random code and someone gave it back), which counts like `observed`. New optional fields: `context`, `fixes` (registered OmaBoot? fix IDs; unknown ones are rejected) and `replaced_parts`. The image tested goes in `omarchy.image`."
    - "`GET /api/v1/snapshot` is what a test tool needs from the catalog offline: match data, the criteria with their `live` flags, and the fixes, with an `ETag` for `If-None-Match`."
    - "Criteria gain `live`. A configuration's `reports` gain `context` and `fixes`."
    - "A source whose key ships inside a public image may submit up to 30 reports an hour, and up to 5 a day from each Mac; over either, `429` with `Retry-After`."
    - "Removed: a criterion's `fix` (its fix issue on GitHub). Fix tracking through GitHub issues is retired; no fix issue was ever opened. The OmaBoot? fixes are in the snapshot's `fixes`, and each one's `url` is its entry at `/fixes`."
    - "MCP: `get_mac` and `what_needs_testing` no longer mention fix issues; `what_needs_testing` points to upstream and `/fixes` for fixing."
    - "Go tools can use the public packages `pkg/report` (the format and its checks) and `pkg/match` (matching on the snapshot)."

- date: "2026-10-05"
  title: MCP answers name the release
  summary: "A Mac sold under several names, such as the iMac10,1 (21.5-inch and 27-inch), is now named after the release an MCP answer is about: `identify_mac`, and `get_mac` or `what_needs_testing` with a `config`. `get_mac` for the whole Mac adds an \"Also sold as\" line."
  notes:
    - "`search_macs` no longer flags a valid value that matches no Mac yet, such as `status:supported`, as a mistake."

- date: "2026-10-05"
  title: An MCP server for AI assistants
  summary: "AI assistants can now look Macs up themselves through the MCP server at `/mcp`, with four read-only tools: `search_macs`, `get_mac`, `identify_mac` and `what_needs_testing`. No key needed. The index lists it as `mcp`."
  notes:
    - "Streamable HTTP without sessions, speaking MCP 2026-07-28 and the earlier versions back to 2025-03-26. Each IP address may make 300 requests a minute."

- date: "2026-10-05"
  title: Descriptions for tools and AI agents
  summary: "The API is now described in full as an OpenAPI 3.1 document at `/api/v1/openapi.json`, and in plain Markdown for language models at `/llms.txt`. The index lists the new document as `openapi`."
  notes:
    - "Unknown `/api` paths now answer 404 in the usual error format, `{\"error\": \"…\"}`."

- date: "2026-10-04"
  title: OpenGL ES levels and known limitations
  summary: "GPU components gain `gles`, the highest OpenGL ES version their Linux driver reaches. Configurations gain `known_limitations`, notes from research that come before any test."

- date: "2026-10-03"
  title: Board IDs per release
  summary: "Configurations gain `board_ids`, the board IDs tied to their release by real machines. Identify a Mac uses them: a matching board shows in a candidate's `matched` as `board:…`."

- date: "2026-10-03"
  title: Omarchy channels
  summary: "Results can come from any Omarchy channel: stable, rc, beta, edge or dev, and each one says its `omarchy_channel`. Stable releases decide verdicts; where a newer build disagrees, a criterion shows it in `newest_build`."
  notes:
    - "Report format: a dev install sends `\"channel\": \"dev\"` and the checkout's commit as `revision`."

- date: "2026-10-03"
  title: Fix tracking
  summary: "A failed criterion can carry `fix`: its GitHub issue, its state (open, claimed, stale, proposed or fixed), who is on it, and `retest` once a fix lands after the latest result."

- date: "2026-10-03"
  title: Port map drawings
  summary: "Configurations gain `portmap_url`, their port layout drawn as an SVG, when there is one."

- date: "2026-10-02"
  title: Ports per connector
  summary: "Configurations gain `connectors`, their port layout, with the criteria each connector is tested for. Port criteria have a result per connector, in `ports`."
  notes:
    - "Report format: port criteria can be reported per connector, as `ports.usb-a@left-2`."
    - "A connector's result can be `covered_by` a group-mate that passed, or flagged `possible_hardware_fault`."

- date: "2026-10-02"
  title: The API opens
  summary: "Version 1: read the catalog and test results, identify a Mac from its hardware, and submit diagnostic reports with a source key, in the `doesitomarchy/report/v1` format."
