# Graphics processors. role: integrated (on the chipset/CPU) or discrete.
# `driver` is the Linux kernel driver seen bound on real machines (research, not a test result).

- id: gpu/intel-gma-950
  name: Intel GMA 950
  vendor: Intel
  role: integrated
  ids: [pci:8086:27a2]
  driver: i915
  notes: Second PCI function 8086:27a6 is the same GPU's secondary display controller.
  sources:
    - https://github.com/linuxhw/LsPCI/tree/master/Mini%20Pc/Apple/Macmini1/Macmini1%2C1
    - https://github.com/linuxhw/LsPCI/tree/master/Mini%20Pc/Apple/Macmini2/Macmini2%2C1

- id: gpu/nvidia-geforce-9400m
  name: NVIDIA GeForce 9400M
  vendor: NVIDIA
  role: integrated
  ids: [pci:10de:0861, pci:10de:0870]
  driver: nouveau
  notes: Chipset-integrated (MCP79) GPU. lspci names this device "C79 [GeForce 9400]".
  sources:
    - https://github.com/linuxhw/LsPCI/tree/master/Mini%20Pc/Apple/Macmini3/Macmini3%2C1
    - https://github.com/linuxhw/LsPCI/tree/master/Notebook/Apple/MacBookAir2/MacBookAir2%2C1

