# Graphics processors. role: integrated (on the chipset/CPU) or discrete.
# `driver` is the Linux kernel driver seen bound on real machines (research, not a test result).
# `gles` is the highest OpenGL ES version the Mesa driver for this GPU reaches, from Mesa's
# docs/features.txt (https://gitlab.freedesktop.org/mesa/mesa/-/blob/main/docs/features.txt):
# 2.0 for i915, crocus Gen4/5, r300 and nv30; 3.0 for crocus Gen6/7, r600 on R600/R700 and nv50;
# 3.1 for r600 on Evergreen/Northern Islands and nvc0 (Kepler); 3.2 for crocus Gen7.5, iris and
# radeonsi. Hyprland 0.50 and later needs 3.0 (PLAN §30).

