    - field: name
      note: Commonly reported as a Broadcom BCM20702 module; not confirmed from a primary source.

- id: bluetooth/apple-05ac-8289
  name: Apple Bluetooth 4.0 (USB 05ac:8289)
  vendor: Apple
  ids: [usb:05ac:8289]
  driver: btusb
  sources:
    - https://github.com/linuxhw/LsUSB/tree/master/Mini%20Pc/Apple/Macmini7/Macmini7%2C1
