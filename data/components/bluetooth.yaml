- id: bluetooth/broadcom-bcm4364
  name: Broadcom BCM4364 Bluetooth 5.0
  vendor: Broadcom
  ids: []
  driver: ""
  notes: Bluetooth half of the BCM4364 combo chip. Not attached over USB, so it does not appear in lsusb.
  sources:
    - https://github.com/linuxhw/LsPCI/tree/master/Mini%20Pc/Apple/Macmini8/Macmini8%2C1
  uncertain:
    - field: driver
      note: Attachment (UART vs PCIe) and the Linux driver path for BCM4364 Bluetooth on T2 Macs need confirming by a test.
