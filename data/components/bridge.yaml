- id: bridge/apple-t2
  name: Apple T2 bridge and Secure Enclave
  vendor: Apple
  ids: [pci:106b:1801, pci:106b:1802]
  driver: apple-bce
  notes: apple-bce provides T2 audio, keyboard/trackpad (laptops) and Touch Bar access. It is out-of-tree and ships with T2-patched kernels.
  sources:
    - https://github.com/linuxhw/LsPCI/tree/master/Mini%20Pc/Apple/Macmini8/Macmini8%2C1
