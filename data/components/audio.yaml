- id: audio/apple-t2-audio
  name: Apple T2 audio (via T2 bridge)
  vendor: Apple
  ids: [pci:106b:1803]
  driver: aaudio
  notes: Exposed through the T2 bridge; the aaudio driver ships with the out-of-tree apple-bce module used by T2 Linux kernels.
  sources:
    - https://github.com/linuxhw/LsPCI/tree/master/Mini%20Pc/Apple/Macmini8/Macmini8%2C1
    - https://github.com/linuxhw/Dmesg/tree/main/Mini%20Pc/Apple/Macmini8/Macmini8%2C1
