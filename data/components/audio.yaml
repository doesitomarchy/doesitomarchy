- id: audio/cirrus-cs8409
  name: Cirrus Logic CS8409 (with CS42L42)
  vendor: Cirrus Logic
  ids: []
  driver: snd_hda_codec_cs8409
  notes: On many observed 2017–2019 iMacs the kernel fell back to the generic HDA parser for this codec, which suggests incomplete support for Apple's CS8409 setup.
