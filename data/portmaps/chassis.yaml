# Port map drawings (gen/portmaps.py). Original line drawings, to scale, in millimetres.
#
# chassis: one physical shape. Laptops are drawn as side elevations of the closed
# machine; `depth` is front-to-back, `thick` the closed height (the wedge Airs take
# `thick` at the hinge and `front` at the tip). Dimensions are Apple Tech Specs.
# Features are unlabelled context (drive slots, lock slots, vents, microphones),
# drawn faintly. Feature x is in view coordinates: mm from the left end of the side
# as you face it (hinge end on the left side, front end on the right side).
#
# drawings: which releases share a drawing, and where each connector sits, in the
# order of data/layouts. Laptop ports take an x (mm, view coordinates); the height
# comes from the profile. Panel ports take [x, y] or [x, y, rotation]. A drawing's
# `features` replace the chassis features for the sides it names.
# Positions were read off the side photos and diagrams in Apple's manuals by eye,
# using a 5% grid over each image or pixel runs; `ref` names the manual images used.

