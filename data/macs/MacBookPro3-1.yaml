identifier: MacBookPro3,1
line: macbook-pro
efi: 64
board_ids: [Mac-F4238BC8]
research_notes: |
  GeForce 8600M GT (G84, nouveau).
  The 15-inch and 17-inch models share this identifier; each size is its own release.
  Audio is a Realtek ALC889A codec on every observed machine.
  Board ID Mac-F42388C8 (with genuine MBP31 firmware) appears on 2 observed machines. That is below the 3-boot evidence bar, so it is not listed; it may be the 17-inch board.
  Apple's identification page no longer lists 2007 MacBook Pros; release names follow the size and season convention used for later models.
