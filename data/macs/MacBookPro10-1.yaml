identifier: MacBookPro10,1
line: macbook-pro
efi: 64
board_ids: [Mac-C3EC7CD22292981F]
research_notes: |
  First 15-inch Retina MacBook Pro. Two GPUs: Intel HD Graphics 4000 and a discrete GeForce GT 650M, switched through a hardware mux.
  Retina display, no optical drive, Ethernet or FireWire port. RAM is soldered. HDMI and two Thunderbolt ports.
  The headphone jack also carries optical digital audio out.
  The SSD is a SATA blade on the Intel 7-series controller. The SD card reader is a PCIe BCM57765 function; the BCM57765/57786 also exposes an Ethernet function with no port, which is left out of the component list.
  Thunderbolt is Cactus Ridge. FaceTime HD camera is USB (05ac:8510). Audio is a Cirrus Logic CS4206 codec on every observed machine.
