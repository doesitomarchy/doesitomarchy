identifier: MacBookPro5,2
line: macbook-pro
efi: 64
board_ids: [Mac-F2268EC8]
research_notes: |
  17-inch unibody with a built-in (non-removable) battery. Early 2009 and Mid 2009 share this identifier and all components.
  Two GPUs: GeForce 9400M chipset graphics and a discrete GeForce 9600M GT. Audio is a Realtek ALC889A codec on every observed machine.
