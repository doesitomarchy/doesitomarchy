identifier: MacBookAir8,2
line: macbook-air
efi: 64
security_chip: t2
board_ids: [Mac-226CB3C6A851A671]
research_notes: |
  T2 Mac. Omarchy's manual lists the MacBook Air 13-inch (2018) A1932 as supported with automatic setup (patched linux-t2 kernel, T2 audio,
  Apple's Broadcom Wi-Fi/Bluetooth firmware, t2fanrd). Disable Secure Boot in Startup Security Utility before installing.
  Keyboard, trackpad, camera and ambient light sensor are USB devices behind the T2 bridge (apple-bce). Charging is over USB-C.
  Adds a True Tone display; hardware is otherwise the 2018 model.
