identifier: iMacPro1,1
line: imac-pro
efi: 64
security_chip: t2
board_ids: [Mac-7BA5B2D9E42DDD94]
research_notes: |
  First T2 Mac. Omarchy's Mac support manual lists the iMac Pro (2017, A1862) as supported with automatic T2 setup (patched linux-t2 kernel,
  T2 audio, Apple's Broadcom Wi-Fi/Bluetooth firmware, t2fanrd). Disable Secure Boot in Startup Security Utility before installing.
  10Gb Ethernet (Aquantia AQC107, atlantic driver) is standard. Two Alpine Ridge controllers drive the four Thunderbolt 3 ports.
  Real machines show the Radeon Pro Vega 56 (1002:6867) and Vega 64 (1002:6860) as different chips; the later Vega 64X has no probes.
sources:
  - https://support.apple.com/en-us/111995
  - https://everymac.com/systems/apple/imac-pro/specs/imac-pro-eight-core-3.2-xeon-27-inch-late-2017-specs.html
  - https://everymac.com/systems/apple/imac-pro/specs/imac-pro-ten-core-3.0-xeon-27-inch-late-2017-specs.html
  - https://everymac.com/systems/apple/imac-pro/specs/imac-pro-14-core-2.5-xeon-27-inch-late-2017-specs.html
  - https://everymac.com/systems/apple/imac-pro/specs/imac-pro-18-core-2.3-xeon-27-inch-late-2017-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/iMacPro/IMP11.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Desktop/Apple/iMacPro1/iMacPro1%2C1
  - https://github.com/linuxhw/Dmesg/tree/main/Desktop/Apple/iMacPro1/iMacPro1%2C1
  - https://omarchy.org/manual/mac-support/
