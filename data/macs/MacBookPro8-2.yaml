identifier: MacBookPro8,2
line: macbook-pro
efi: 64
board_ids: [Mac-94245A3940C91C80]
research_notes: |
  Quad-core Sandy Bridge with two GPUs: Intel HD Graphics 3000 and a discrete AMD Radeon (TeraScale 2, radeon driver), switched through a hardware mux.
  Sandy Bridge with Thunderbolt (Light Ridge). The SD card reader is a PCIe function of the BCM57765 Ethernet chip (sdhci-pci). FaceTime HD camera is USB (05ac:8509). Audio is a Cirrus Logic CS4206 codec on every observed machine.
  Three discrete GPUs across the releases, each a distinct PCI device: Radeon HD 6490M (1002:6760), HD 6750M (1002:6741) and HD 6770M (1002:6740).
