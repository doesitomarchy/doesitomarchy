identifier: MacBook5,2
line: macbook
efi: 64
board_ids: [Mac-F22788AA]
research_notes: |
  White polycarbonate MacBook with the GeForce 9400M chipset (Early and Mid 2009). Audio is a Realtek ALC889A codec on every observed machine.
  The iSight reports "no firmware loaded" and needs firmware extracted from macOS.
sources:
  - https://support.apple.com/en-us/103257
  - https://everymac.com/systems/apple/macbook/specs/macbook-core-2-duo-2.0-white-13-early-2009-nvidia-specs.html
  - https://everymac.com/systems/apple/macbook/specs/macbook-core-2-duo-2.13-white-13-mid-2009-nvidia-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacBook/MB52.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Notebook/Apple/MacBook5/MacBook5%2C2
