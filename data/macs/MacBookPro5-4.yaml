identifier: MacBookPro5,4
line: macbook-pro
efi: 64
board_ids: [Mac-F22587A1]
research_notes: |
  Mid 2009 15-inch: built-in battery, SD card slot (internal USB reader) instead of ExpressCard/34. Audio is a Cirrus Logic CS4206 codec on every observed machine.
  The 2.53 GHz entry model has only the GeForce 9400M (no discrete GPU).
  Apple's identification page lists MC118 under MacBookPro5,3; all 40 observed MacBookPro5,4 machines have only the 9400M, and OpenCore names MacBookPro5,4 "MacBook Pro (15-inch, 2.53GHz, Mid 2009)", the MC118 model.
sources:
  - https://support.apple.com/en-us/108052
  - https://everymac.com/systems/apple/macbook_pro/specs/macbook-pro-core-2-duo-2.53-aluminum-15-mid-2009-sd-unibody-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacBookPro/MBP54.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Notebook/Apple/MacBookPro5/MacBookPro5%2C4
