identifier: MacBookPro6,2
line: macbook-pro
efi: 64
board_ids: [Mac-F22586C8]
research_notes: |
  Arrandale Core i5/i7 with two GPUs: Intel HD Graphics in the CPU package and a discrete GeForce GT 330M. Switching is automatic in macOS through a hardware mux.
  Mini DisplayPort carries audio. Audio is a Cirrus Logic CS4206 codec on every observed machine.
  MC847LL/A (2.8 GHz, October 2010) is a speed bump filed under Mid 2010.
