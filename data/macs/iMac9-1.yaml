        memory: { type: DDR3-1066 SO-DIMM, standard_gb: [2], max_gb: 8 }
        storage: { interface: sata, standard: ["320 GB HDD"] }
        display: { inches: 20, resolution: 1680x1050, panel: "LCD" }
        components: [gpu/nvidia-geforce-9400m, wifi/broadcom-bcm4322, bluetooth/apple-05ac-8215, audio/realtek-alc889a, ethernet/nvidia-mcp79, firewire/lsi-fw643, storage/nvidia-mcp79-sata, camera/apple-isight-05ac-8502, ir/apple-05ac-8242]
