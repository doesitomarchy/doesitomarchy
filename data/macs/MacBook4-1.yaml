    name: "MacBook (13-inch, Early 2008)"
    announced: 2008-02-26
    discontinued: 2009-01-20
    model_numbers: [A1181]
    emc: ["2242"]
    configs:
      - id: macbook4-1-early-2008-a
        label: "Core 2 Duo 2.1 or 2.4 GHz \u00b7 GMA X3100 (white or black)"
        order_numbers: [MB402LL/A, MB403LL/A, MB404LL/A]
        cpu:
          codename: penryn
