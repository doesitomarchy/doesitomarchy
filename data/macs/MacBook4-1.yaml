identifier: MacBook4,1
line: macbook
efi: 64
board_ids: [Mac-F22788A9]
research_notes: |
  Intel GMA X3100 has only early KMS/OpenGL support; Hyprland may fall back to software rendering. Audio is a Realtek ALC889A codec on every observed machine.
  The iSight reports "no firmware loaded" and needs firmware extracted from macOS.
  OpenCore also names a "MacBook (13-inch, Late 2008)" release for this identifier (the white MacBook sold alongside the aluminum model); no separate spec source was found for it.
sources:
  - https://everymac.com/systems/apple/macbook/specs/macbook-core-2-duo-2.1-white-13-early-2008-penryn-specs.html
  - https://everymac.com/systems/apple/macbook/specs/macbook-core-2-duo-2.4-black-13-early-2008-penryn-specs.html
  - https://everymac.com/systems/apple/macbook/specs/macbook-core-2-duo-2.4-white-13-early-2008-penryn-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacBook/MB41.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Notebook/Apple/MacBook4/MacBook4%2C1
