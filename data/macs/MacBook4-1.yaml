        memory: { type: DDR2-667 SO-DIMM, standard_gb: [1, 2], max_gb: 4 }
        storage: { interface: sata, standard: ["120 GB HDD", "160 GB HDD", "250 GB HDD"] }
        display: { inches: 13.3, resolution: 1280x800, panel: "LCD glossy" }
        components: [gpu/intel-gma-x3100, wifi/broadcom-bcm4321, bluetooth/apple-05ac-8205, audio/realtek-alc889a, ethernet/marvell-88e8058, firewire/lsi-fw322, storage/intel-ich8m-sata, camera/apple-isight-05ac-8300, ir/apple-05ac-8242, input/apple-mb-2007]
        ports: { usb-a-2: 2, firewire-400: 1, mini-dvi: 1, ethernet-gbe: 1, audio-in: 1, audio-in-optical: 1, audio-out: 1, audio-out-optical: 1 }
