identifier: MacPro5,1
line: mac-pro
efi: 64
board_ids: [Mac-F221BEC8]
research_notes: |
  Graphics cards are PCIe cards that owners often replace; configurations cover only the cards Apple sold with the machine.
  Mid 2010 and Mid 2012 (and their Server variants, which add drives only) share this identifier. Wi-Fi is standard from 2010.
  Quad-core models use Bloomfield-class Xeon W3500 CPUs; 6-core and dual-processor models use Westmere-EP.
  A few Linux boots report an iMac Pro board ID; those are machines running OpenCore with spoofed SMBIOS.
  Audio is a Realtek ALC889A codec on every observed machine. Widely used as a Linux workstation.
