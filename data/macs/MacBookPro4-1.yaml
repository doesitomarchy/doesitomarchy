identifier: MacBookPro4,1
line: macbook-pro
efi: 64
board_ids: [Mac-F42C86C8]
research_notes: |
  GeForce 8600M GT (G84, nouveau).
  The 15-inch and 17-inch models share this identifier; each size is its own release.
  Audio is a Realtek ALC889A codec on every observed machine.
  Two board IDs are seen on real machines (Mac-F42C86C8 on 4 machines, 5 boots); OpenCore lists only Mac-F42C89C8.
