identifier: Xserve1,1
line: xserve
efi: 32
board_ids: [Mac-F4208AC8]
research_notes: |
  1U rack server. 64-bit Xeon CPUs with 32-bit EFI firmware: the stock installer needs a 32-bit EFI boot shim.
  No audio hardware, Wi-Fi or Bluetooth. Graphics are an on-board ATI Radeon X1300 with a mini-DVI port.
  Only one Linux hardware probe exists; it also shows optional SAS/SCSI cards (not included here).
sources:
  - https://everymac.com/systems/apple/xserve/specs/xserve-intel-xeon-2.0-quad-specs.html
  - https://everymac.com/systems/apple/xserve/specs/xserve-intel-xeon-2.66-quad-specs.html
  - https://everymac.com/systems/apple/xserve/specs/xserve-intel-xeon-3.0-quad-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/Xserve/XS11.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Desktop/Apple/Xserve1/Xserve1%2C1
releases:
  - id: late-2006
    name: "Xserve (Late 2006)"
    announced: 2006-08-07
    discontinued: 2008-01-08
    model_numbers: [A1196]
    emc: ["2107"]
    configs:
      - id: xserve1-1-late-2006-a
        label: "Dual-core Xeon 2.0, 2.66 or 3.0 GHz (×2) · Radeon X1300"
        order_numbers: [MA409LL/A]
        cpu:
          codename: woodcrest
          standard: [{ model: "Dual Xeon 5130", ghz: 2.0, cores: 4 }]
          bto: [{ model: "Dual Xeon 5150", ghz: 2.66, cores: 4 }, { model: "Dual Xeon 5160", ghz: 3.0, cores: 4 }]
        memory: { type: DDR2-667 FB-DIMM ECC, standard_gb: [1], max_gb: 32 }
        storage: { interface: sata, standard: ["80 GB HDD"], bto: ["250 GB HDD", "500 GB HDD", "750 GB HDD"] }
        components: [gpu/ati-radeon-x1300, ethernet/intel-80003es2lan, firewire/ti-tsb82aa2, storage/intel-esb2-sata]
        ports: { usb-a-2: 2, firewire-400: 1, firewire-800: 2, ethernet-gbe: 2, mini-dvi: 1 }
        features: [fan, optical-drive]
