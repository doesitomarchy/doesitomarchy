identifier: MacBookPro11,1
line: macbook-pro
efi: 64
board_ids: [Mac-189A3D4F975D5FFC]
research_notes: |
  Haswell 13-inch Retina, Intel Iris 5100 graphics.
  Retina display, no optical drive, Ethernet or FireWire port. RAM is soldered. HDMI and two Thunderbolt ports.
  The headphone jack also carries optical digital audio out.
  PCIe flash storage speaks AHCI (Samsung or Marvell controllers seen). The FaceTime HD camera is a PCIe device (Broadcom 1570) that needs the out-of-tree facetimehd driver.
  Thunderbolt 2 (Falcon Ridge). The SD card reader is an internal USB device (05ac:8406). Audio is a Cirrus Logic CS4208 codec on every observed machine.
  BCM4360 802.11ac Wi-Fi has no in-kernel driver; the proprietary wl driver is the usual route.
