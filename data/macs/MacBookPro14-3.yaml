identifier: MacBookPro14,3
line: macbook-pro
efi: 64
security_chip: t1
board_ids: [Mac-551B86E5744E2388]
research_notes: |
  15-inch with Touch Bar and Touch ID. Two GPUs: Intel HD Graphics 630 and a discrete AMD Radeon Pro 555 or 560 (Polaris 21, 1002:67ef, amdgpu), with automatic switching in macOS. BCM43602 Wi-Fi uses brcmfmac.
  Apple T1 chip: an ARM co-processor that runs the Touch Bar, the Touch ID secure enclave and the FaceTime HD camera. It appears to the host as a USB device (iBridge, 05ac:8600). It does not sit in the path to the SSD or audio and has no secure-boot policy.
  Thunderbolt 3 (USB-C) ports only, used for charging, USB, DisplayPort and Thunderbolt; plus one headphone jack. Keyboard, trackpad and backlight connect over SPI (in-kernel applespi driver). Bluetooth is on UART (hci_uart).
  The NVMe SSD is soldered. Audio is a Cirrus Logic CS8409 codec; on many observed boots the kernel binds only the generic HDA codec driver to it. Thunderbolt 3 controller is Alpine Ridge.
