identifier: iMac6,1
line: imac
efi: 32
board_ids: [Mac-F4218FC8]
research_notes: |
  First 24-inch iMac. 32-bit EFI firmware. Graphics are NVIDIA GeForce 7300 GT (standard) or 7600 GT (build to order); the OpenCore database's Radeon X1600 entry is wrong.
