identifier: MacBook8,1
line: macbook
efi: 64
board_ids: [Mac-BE0E8AC46FE800CC]
research_notes: |
  Fanless 12-inch Retina MacBook with a single USB-C port (charging, USB and DisplayPort through an adapter).
  Keyboard, trackpad and backlight connect over SPI (in-kernel applespi driver). Bluetooth is on UART (hci_uart). The FaceTime HD camera is a PCIe device needing the out-of-tree facetimehd driver.
  BCM4350 Wi-Fi uses brcmfmac.
sources:
  - https://support.apple.com/en-us/103257
  - https://everymac.com/systems/apple/macbook/specs/macbook-core-m-1.1-12-early-2015-specs.html
  - https://everymac.com/systems/apple/macbook/specs/macbook-core-m-1.2-12-early-2015-specs.html
  - https://everymac.com/systems/apple/macbook/specs/macbook-core-m-1.3-12-early-2015-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacBook/MB81.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Notebook/Apple/MacBook8/MacBook8%2C1
releases:
  - id: early-2015
    name: "MacBook (Retina, 12-inch, Early 2015)"
    announced: 2015-03-09
    discontinued: 2016-04-19
    model_numbers: [A1534]
    emc: ["2746"]
    configs:
      - id: macbook8-1-early-2015-a
        label: "Core M 1.1 or 1.2 GHz \u00b7 HD Graphics 5300"
        order_numbers: [MF855LL/A, MF865LL/A, MJY32LL/A, MJY42LL/A, MK4M2LL/A, MK4N2LL/A]
        cpu:
          codename: broadwell
          standard: [{ model: Core M-5Y31, ghz: 1.1, cores: 2 }, { model: Core M-5Y51, ghz: 1.2, cores: 2 }]
          bto: [{ model: Core M-5Y71, ghz: 1.3, cores: 2 }]
        memory: { type: LPDDR3-1600, standard_gb: [8], max_gb: 8, soldered: true }
        storage: { interface: nvme, standard: ["256 GB SSD", "512 GB SSD"] }
        display: { inches: 12, resolution: 2304x1440, panel: "Retina LED IPS" }
        components: [gpu/intel-hd-5300, wifi/broadcom-bcm4350, bluetooth/broadcom-bcm4350-uart, audio/cirrus-cs4208, camera/broadcom-1570-facetime-hd, storage/apple-s1x-nvme, input/apple-spi-keyboard]
        ports: { usb-c: 1, audio-out: 1 }
        features: [battery, lid, builtin-display, builtin-keyboard, trackpad, builtin-speaker, builtin-mic, keyboard-backlight, ambient-light-sensor, force-touch, usb-c-charging]
        uncertain:
          - field: components.bluetooth
            note: "hci_uart is seen on the 2016 and 2017 models; no observed MacBook8,1 boot logs Bluetooth, so the same UART attachment is assumed."
