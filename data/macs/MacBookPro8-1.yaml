identifier: MacBookPro8,1
line: macbook-pro
efi: 64
board_ids: [Mac-94245B3640C91C81]
research_notes: |
  Sandy Bridge with Thunderbolt (Light Ridge). The SD card reader is a PCIe function of the BCM57765 Ethernet chip (sdhci-pci). FaceTime HD camera is USB (05ac:8509). Audio is a Cirrus Logic CS4206 codec on every observed machine.
  Intel HD Graphics 3000 only. One combined audio jack.
