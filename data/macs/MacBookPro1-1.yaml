  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacBookPro/MBP11.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Notebook/Apple/MacBookPro1/MacBookPro1%2C1
