identifier: MacBookPro1,1
line: macbook-pro
efi: 32
hard_blocker: "32-bit-only CPU (Intel Core Duo \"Yonah\"). Omarchy and Arch Linux support x86_64 only."
board_ids: [Mac-F425BEC8]
research_notes: |
  First Intel MacBook Pro. 32-bit Core Duo CPU and 32-bit EFI firmware, so no configuration can run Omarchy.
  The iSight camera reports "no firmware loaded" and needs firmware extracted from macOS.
  Apple's identification page no longer lists 2006–2007 MacBook Pros; release names follow the size and season convention used for later models.
