identifier: MacBookAir6,1
line: macbook-air
efi: 64
board_ids: [Mac-35C1E88140C3E6CF]
research_notes: |
  Mid 2013 and Early 2014 share this identifier and all components.
  PCIe flash storage speaks AHCI. The FaceTime HD camera is a PCIe device (Broadcom 1570) that needs the out-of-tree facetimehd driver.
  BCM4360 Wi-Fi has no in-kernel 802.11ac driver; the proprietary wl driver is the usual route.
sources:
  - https://support.apple.com/en-us/112437
  - https://support.apple.com/en-us/112032
  - https://support.apple.com/en-us/102869
