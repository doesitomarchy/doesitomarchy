  - https://everymac.com/systems/apple/macbook-air/specs/macbook-air-core-i5-1.4-11-early-2014-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacBookAir/MBA61.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Notebook/Apple/MacBookAir6/MacBookAir6%2C1
