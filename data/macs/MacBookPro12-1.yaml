identifier: MacBookPro12,1
line: macbook-pro
efi: 64
board_ids: [Mac-E43C1C25D4880AD6]
research_notes: |
  Broadwell 13-inch Retina with Intel Iris 6100.
  Retina display, no optical drive, Ethernet or FireWire port. RAM is soldered. HDMI and two Thunderbolt ports.
  The headphone jack also carries optical digital audio out.
  PCIe flash storage speaks AHCI (Samsung or Marvell controllers seen). The FaceTime HD camera is a PCIe device (Broadcom 1570) that needs the out-of-tree facetimehd driver.
  Thunderbolt 2 (Falcon Ridge). The SD card reader is an internal USB device (05ac:8406). Audio is a Cirrus Logic CS4208 codec on every observed machine.
  Force Touch trackpad. BCM43602 802.11ac Wi-Fi uses the in-kernel brcmfmac driver.
sources:
  - https://support.apple.com/en-us/108052
  - https://everymac.com/systems/apple/macbook_pro/specs/macbook-pro-core-i5-2.7-13-early-2015-retina-display-specs.html
  - https://everymac.com/systems/apple/macbook_pro/specs/macbook-pro-core-i5-2.9-13-early-2015-retina-display-specs.html
  - https://everymac.com/systems/apple/macbook_pro/specs/macbook-pro-core-i7-3.1-13-early-2015-retina-display-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacBookPro/MBP121.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Notebook/Apple/MacBookPro12/MacBookPro12%2C1
