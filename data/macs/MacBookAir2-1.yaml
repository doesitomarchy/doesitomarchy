identifier: MacBookAir2,1
line: macbook-air
efi: 64
board_ids: [Mac-F42D88C8]
research_notes: |
  Late 2008 and Mid 2009 share this identifier and all components. Audio is a Realtek ALC889A on every observed machine.
  Bluetooth: 6 of 8 observed machines report USB 05ac:8216, 2 report 05ac:8210.
  Apple's identification page also lists MC505 under Mid 2009; MC505 is the 11-inch Late 2010 model.
sources:
  - https://support.apple.com/en-us/112660
  - https://support.apple.com/en-us/102869
  - https://everymac.com/systems/apple/macbook-air/specs/macbook-air-core-2-duo-1.6-13-nvidia-late-2008-specs.html
  - https://everymac.com/systems/apple/macbook-air/specs/macbook-air-core-2-duo-1.86-13-mid-2009-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacBookAir/MBA21.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Notebook/Apple/MacBookAir2/MacBookAir2%2C1
