identifier: MacBookPro16,1
line: macbook-pro
efi: 64
security_chip: t2
board_ids: [Mac-E1008331FDC96864]
research_notes: |
  Apple T2 chip. The SSD controller, audio, FaceTime camera, ambient light sensor, Touch Bar, keyboard and trackpad are reached through the T2 bridge (apple-bce binds on real Linux machines).
  Booting a non-Apple OS requires Startup Security Utility (in Recovery) set to "No Security" and "Allow booting from external or removable media". The Broadcom Wi-Fi/Bluetooth chip needs Apple's firmware files.
  Thunderbolt 3 (USB-C) ports only, plus a headphone jack. Touch Bar and Touch ID on every model.
  16-inch with a scissor-switch keyboard, physical Escape key and 3072x1920 True Tone display. MacBookPro16,4 is the build-to-order Radeon Pro 5600M (Navi 12, HBM2) model sold from June 2020.
  Two GPUs: Intel UHD Graphics 630 and a discrete AMD Radeon Pro 5300M or 5500M (Navi 14, 1002:7340, amdgpu).
