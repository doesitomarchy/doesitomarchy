identifier: MacPro7,1
line: mac-pro
efi: 64
security_chip: t2
board_ids: [Mac-27AD2F918AE68F61]
research_notes: |
  Last Intel Mac Pro, in tower and rack-mount versions with identical internals. Every unit was build to order; the Radeon Pro 580X was the base graphics.
  T2 Mac: Omarchy's manual does not list it among supported T2 Macs, though the same automatic T2 setup should apply. Disable Secure Boot before installing.
  Two 10Gb Ethernet ports (Aquantia AQC107) are standard. Radeon Pro Vega II and W6800X Duo modules carry two GPUs of the same chip.
