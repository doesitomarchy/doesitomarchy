        label: "Any Xeon W \u00b7 Radeon Pro 580X MPX (standard graphics)"
        bto_only: true
        cpu:
          codename: cascade-lake
          standard: [{ model: "Xeon W-3223", ghz: 3.5, cores: 8 }, { model: "Xeon W-3235", ghz: 3.3, cores: 12 }, { model: "Xeon W-3245", ghz: 3.2, cores: 16 }, { model: "Xeon W-3265M", ghz: 2.7, cores: 24 }, { model: "Xeon W-3275M", ghz: 2.5, cores: 28 }]
        memory: { type: DDR4-2933 ECC, standard_gb: [32], max_gb: 1536 }
        storage: { interface: nvme, standard: ["256 GB SSD"], bto: ["1 TB SSD", "2 TB SSD", "4 TB SSD", "8 TB SSD"] }
        components: [gpu/amd-radeon-pro-570-580, wifi/broadcom-bcm4364, bluetooth/broadcom-bcm4364, audio/apple-t2-audio, ethernet/aquantia-aqc107, thunderbolt/intel-titan-ridge, storage/apple-ans2-nvme, storage/intel-c620-sata, bridge/apple-t2]
        ports: { usb-a-3: 2, thunderbolt-3: 4, hdmi: 1, ethernet-10gbe: 2, audio-out: 1 }
        features: [builtin-speaker, fan]
