identifier: Macmini7,1
line: mac-mini
efi: 64
board_ids: [Mac-35C5E08120C7EEAF]
research_notes: |
  Two GPUs across the line: the 1.4 GHz model has Intel HD Graphics 5000, all others Intel Iris 5100.
  Memory is soldered. FireWire was dropped. SSD and Fusion Drive options use Apple PCIe flash that speaks AHCI (not NVMe).
  BCM4360 Wi-Fi has no in-kernel 802.11ac driver; the proprietary wl driver is the usual route.
sources:
  - https://support.apple.com/en-us/111931
  - https://support.apple.com/en-us/102852
  - https://everymac.com/systems/apple/mac_mini/specs/mac-mini-core-i5-1.4-late-2014-specs.html
  - https://everymac.com/systems/apple/mac_mini/specs/mac-mini-core-i5-2.6-late-2014-specs.html
  - https://everymac.com/systems/apple/mac_mini/specs/mac-mini-core-i5-2.8-late-2014-specs.html
  - https://everymac.com/systems/apple/mac_mini/specs/mac-mini-core-i7-3.0-late-2014-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/Macmini/MM71.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Mini%20Pc/Apple/Macmini7/Macmini7%2C1
releases:
  - id: late-2014
    name: Mac mini (Late 2014)
    announced: 2014-10-16
    discontinued: 2018-10-30
    model_numbers: [A1347]
    emc: ["2840"]
    configs:
      - id: macmini7-1-late-2014-a
        label: Core i5 1.4 GHz · HD Graphics 5000
        order_numbers: [MGEM2LL/A]
        cpu:
          codename: haswell
          standard: [{ model: Core i5-4260U, ghz: 1.4, cores: 2 }]
        memory: { type: LPDDR3-1600, standard_gb: [4], max_gb: 16, soldered: true }
        storage: { interface: sata, standard: [500 GB HDD], bto: [1 TB Fusion Drive] }
        components: [gpu/intel-hd-5000, wifi/broadcom-bcm4360, bluetooth/apple-05ac-8289, audio/cirrus-cs4208, ethernet/broadcom-bcm57766, card-reader/broadcom-bcm57765-sd, thunderbolt/intel-falcon-ridge, storage/intel-8-series-sata, ir/apple-05ac-8242]
        bto_components: [storage/apple-pcie-ssd-ahci]
        ports: { thunderbolt-2: 2, usb-a-3: 4, hdmi: 1, sd-card: 1, ethernet-gbe: 1, audio-in: 1, audio-in-optical: 1, audio-out: 1, audio-out-optical: 1 }
        features: [builtin-speaker, headset-mic, ir-receiver, fan]
      - id: macmini7-1-late-2014-b
        label: Core i5 2.6/2.8 GHz or Core i7 3.0 GHz · Iris Graphics 5100
        order_numbers: [MGEN2LL/A, MGEQ2LL/A]
        cpu:
          codename: haswell
          standard:
            - { model: Core i5-4278U, ghz: 2.6, cores: 2 }
            - { model: Core i5-4308U, ghz: 2.8, cores: 2 }
          bto: [{ model: Core i7-4578U, ghz: 3.0, cores: 2 }]
        memory: { type: LPDDR3-1600, standard_gb: [8], max_gb: 16, soldered: true }
        storage: { interface: sata, standard: [1 TB HDD, 1 TB Fusion Drive], bto: [2 TB Fusion Drive, 256 GB SSD, 512 GB SSD, 1 TB SSD] }
        components: [gpu/intel-iris-5100, wifi/broadcom-bcm4360, bluetooth/apple-05ac-8289, audio/cirrus-cs4208, ethernet/broadcom-bcm57766, card-reader/broadcom-bcm57765-sd, thunderbolt/intel-falcon-ridge, storage/intel-8-series-sata, ir/apple-05ac-8242]
        bto_components: [storage/apple-pcie-ssd-ahci]
        ports: { thunderbolt-2: 2, usb-a-3: 4, hdmi: 1, sd-card: 1, ethernet-gbe: 1, audio-in: 1, audio-in-optical: 1, audio-out: 1, audio-out-optical: 1 }
        features: [builtin-speaker, headset-mic, ir-receiver, fan]
        notes: MGEQ2LL/A ships with a Fusion Drive (Apple PCIe flash plus a SATA hard drive).
