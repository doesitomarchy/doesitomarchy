identifier: MacBook3,1
line: macbook
efi: 64
board_ids: [Mac-F22788C8]
research_notes: |
  Intel GMA X3100 has only early KMS/OpenGL support; Hyprland may fall back to software rendering. Audio is a Realtek ALC889A codec on every observed machine.
  The iSight reports "no firmware loaded" and needs firmware extracted from macOS.
sources:
  - https://everymac.com/systems/apple/macbook/specs/macbook-core-2-duo-2.0-white-13-late-2007-santa-rosa-specs.html
  - https://everymac.com/systems/apple/macbook/specs/macbook-core-2-duo-2.2-black-13-late-2007-santa-rosa-specs.html
  - https://everymac.com/systems/apple/macbook/specs/macbook-core-2-duo-2.2-white-13-late-2007-santa-rosa-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacBook/MB31.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Notebook/Apple/MacBook3/MacBook3%2C1
releases:
  - id: late-2007
    name: "MacBook (13-inch, Late 2007)"
    announced: 2007-11-01
    discontinued: 2008-02-26
    model_numbers: [A1181]
    emc: ["2200"]
    configs:
      - id: macbook3-1-late-2007-a
        label: "Core 2 Duo 2.0 or 2.2 GHz \u00b7 GMA X3100 (white or black)"
        order_numbers: [MB061LL/B, MB062LL/B, MB063LL/B]
        cpu:
          codename: merom
          standard: [{ model: Core 2 Duo T7300, ghz: 2.0, cores: 2 }, { model: Core 2 Duo T7500, ghz: 2.2, cores: 2 }]
        memory: { type: DDR2-667 SO-DIMM, standard_gb: [1, 2], max_gb: 4 }
        storage: { interface: sata, standard: ["80 GB HDD", "120 GB HDD", "160 GB HDD"] }
        display: { inches: 13.3, resolution: 1280x800, panel: "LCD glossy" }
        components: [gpu/intel-gma-x3100, wifi/broadcom-bcm4321, bluetooth/apple-05ac-8205, audio/realtek-alc889a, ethernet/marvell-88e8058, firewire/lsi-fw322, storage/intel-ich8m-sata, camera/apple-isight-05ac-8300, ir/apple-05ac-8242, input/apple-mb-2007]
        ports: { usb-a-2: 2, firewire-400: 1, mini-dvi: 1, ethernet-gbe: 1, audio-in: 1, audio-in-optical: 1, audio-out: 1, audio-out-optical: 1 }
        features: [battery, lid, builtin-display, builtin-keyboard, trackpad, builtin-speaker, builtin-mic, fan, ir-receiver, optical-drive]
