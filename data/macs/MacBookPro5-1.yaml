identifier: MacBookPro5,1
line: macbook-pro
efi: 64
board_ids: [Mac-F42D86C8, Mac-F42D86A9]
research_notes: |
  First aluminum unibody MacBook Pro: glass Multi-Touch trackpad (bcm5974), Mini DisplayPort, FireWire 800 only.
  Two GPUs: GeForce 9400M chipset graphics and a discrete GeForce 9600M GT. macOS switches between them only on logout.
  Audio is a Realtek ALC889A codec on every observed machine. Two board IDs are seen on real machines (Mac-F42D86A9 on 6 machines, 14 boots); OpenCore lists only Mac-F42D86C8.
  MC026LL/A (2.66 GHz, March 2009) is a speed bump that Apple files under the Late 2008 model.
