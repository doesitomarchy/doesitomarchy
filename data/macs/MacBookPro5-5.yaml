identifier: MacBookPro5,5
line: macbook-pro
efi: 64
board_ids: [Mac-F2268AC8]
research_notes: |
  First 13-inch MacBook Pro (the former aluminum MacBook). One combined audio jack: optical/analog out, switchable to analog line in.
  SD card slot (internal USB reader). Audio is a Cirrus Logic CS4206 codec on every observed machine.
