identifier: MacBookAir8,1
line: macbook-air
efi: 64
security_chip: t2
board_ids: [Mac-827FAC58A8FDFA22]
research_notes: |
  Apple T2 chip. The SSD controller, audio, FaceTime camera and ambient light sensor are reached through the T2 bridge (apple-bce binds on real Linux machines). Keyboard and trackpad are also USB devices behind the T2.
  Booting a non-Apple OS requires Startup Security Utility (in Recovery) set to "No Security" and "Allow booting from external or removable media". The Broadcom Wi-Fi/Bluetooth chip needs Apple's firmware files.
  Charging is over USB-C.
