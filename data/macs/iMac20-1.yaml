identifier: iMac20,1
line: imac
efi: 64
security_chip: t2
board_ids: [Mac-CFF7D910A743CAAF]
research_notes: |
  Last Intel iMac and the only T2 iMac. Omarchy's Mac support manual does not list it among supported T2 Macs, though the same automatic T2 setup should apply.
  Disable Secure Boot in Startup Security Utility before installing. Very few Linux hardware probes exist for this model.
  iMac20,1 covers the Radeon Pro 5300 and 5500 XT configurations; the 5700/5700 XT upgrades report iMac20,2.
sources:
