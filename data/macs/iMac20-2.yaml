identifier: iMac20,2
line: imac
efi: 64
security_chip: t2
board_ids: [Mac-AF89B6D9451A490B]
research_notes: |
  Last Intel iMac and the only T2 iMac. Apple T2 chip. The SSD controller, audio, FaceTime camera and ambient light sensor are reached through the T2 bridge (apple-bce binds on real Linux machines).
  Booting a non-Apple OS requires Startup Security Utility (in Recovery) set to "No Security" and "Allow booting from external or removable media". The Broadcom Wi-Fi/Bluetooth chip needs Apple's firmware files.
  Very few Linux hardware probes exist for this model.
  iMac20,2 covers the Radeon Pro 5700 and 5700 XT build-to-order configurations. No Linux hardware probes exist for it.
