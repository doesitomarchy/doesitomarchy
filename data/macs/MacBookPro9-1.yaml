identifier: MacBookPro9,1
line: macbook-pro
efi: 64
board_ids: [Mac-4B7AC7E43945597E]
research_notes: |
  Ivy Bridge, USB 3, Thunderbolt (Light Ridge). The SD card reader is a PCIe function of the BCM57765 Ethernet chip. Last MacBook Pros with an optical drive, FireWire 800 and user-replaceable RAM and 2.5-inch drive. Audio is a Cirrus Logic CS4206 codec on every observed machine.
  Two GPUs: Intel HD Graphics 4000 and a discrete GeForce GT 650M (Kepler), switched through a hardware mux.
