    name: "MacBook Pro (17-inch, Late 2006)"
    announced: 2006-10-24
    discontinued: 2007-06-05
    model_numbers: [A1212]
    emc: ["2119"]
    configs:
      - id: macbookpro2-1-17-late-2006-a
        label: "Core 2 Duo 2.33 GHz \u00b7 Mobility Radeon X1600"
