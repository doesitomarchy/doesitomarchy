identifier: MacBookPro2,1
line: macbook-pro
efi: 32
board_ids: [Mac-F42189C8]
research_notes: |
  64-bit Core 2 Duo CPU with 32-bit EFI firmware: the stock installer needs a 32-bit EFI boot shim.
  Draft-n Atheros AR5418 Wi-Fi (ath9k). The iSight camera reports "no firmware loaded" and needs firmware extracted from macOS.
  Apple's identification page no longer lists 2006–2007 MacBook Pros; release names follow the size and season convention used for later models.
sources:
  - https://support.apple.com/en-us/108052
  - https://everymac.com/systems/apple/macbook_pro/specs/macbook-pro-core-2-duo-2.33-17-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacBookPro/MBP21.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Notebook/Apple/MacBookPro2/MacBookPro2%2C1
