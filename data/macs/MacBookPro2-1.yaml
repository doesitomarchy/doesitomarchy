        ports: { usb-a-2: 3, firewire-400: 1, firewire-800: 1, dvi: 1, ethernet-gbe: 1, expresscard-34: 1, audio-in: 1, audio-in-optical: 1, audio-out: 1, audio-out-optical: 1 }
