identifier: MacBookPro14,1
line: macbook-pro
efi: 64
board_ids: [Mac-B4831CEBD52A0C4C]
research_notes: |
  13-inch with two Thunderbolt 3 ports and function keys (no Touch Bar, no T1). The FaceTime HD camera is a PCIe device (Broadcom 1570, facetimehd driver). BCM4350 Wi-Fi uses brcmfmac.
  Storage: 93 of 143 observed machines use an Apple S3X NVMe controller, 35 a Samsung NVMe controller; both use the in-kernel nvme driver.
  Thunderbolt 3 (USB-C) ports only, used for charging, USB, DisplayPort and Thunderbolt; plus one headphone jack. Keyboard, trackpad and backlight connect over SPI (in-kernel applespi driver). Bluetooth is on UART (hci_uart).
  The NVMe SSD is soldered. Audio is a Cirrus Logic CS8409 codec; on many observed boots the kernel binds only the generic HDA codec driver to it. Thunderbolt 3 controller is Alpine Ridge.
sources:
  - https://support.apple.com/en-us/108052
  - https://everymac.com/systems/apple/macbook_pro/specs/macbook-pro-core-i5-2.3-13-mid-2017-retina-display-no-touch-bar-specs.html
  - https://everymac.com/systems/apple/macbook_pro/specs/macbook-pro-core-i7-2.5-13-mid-2017-retina-display-no-touch-bar-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacBookPro/MBP141.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Notebook/Apple/MacBookPro14/MacBookPro14%2C1
