identifier: MacPro6,1
line: mac-pro
efi: 64
board_ids: [Mac-F60DEB81FF30ACF6]
research_notes: |
  Cylindrical Mac Pro with dual AMD FirePro GPUs (both the same model). Six Thunderbolt 2 ports, no internal drive bays or optical drive.
  Audio is a Cirrus Logic CS4208 codec on every observed machine. BCM4360 Wi-Fi has no in-kernel 802.11ac driver; the proprietary wl driver is the usual route.
sources:
  - https://support.apple.com/en-us/112025
  - https://support.apple.com/en-us/102887
  - https://everymac.com/systems/apple/mac_pro/specs/mac-pro-eight-core-3.0-xeon-e5-gray-black-cylinder-late-2013-specs.html
  - https://everymac.com/systems/apple/mac_pro/specs/mac-pro-quad-core-3.7-xeon-e5-gray-black-cylinder-late-2013-specs.html
  - https://everymac.com/systems/apple/mac_pro/specs/mac-pro-six-core-3.5-xeon-e5-gray-black-cylinder-late-2013-specs.html
  - https://everymac.com/systems/apple/mac_pro/specs/mac-pro-twelve-core-2.7-xeon-e5-gray-black-cylinder-late-2013-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacPro/MP61.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Desktop/Apple/MacPro6/MacPro6%2C1
  - https://github.com/linuxhw/Dmesg/tree/main/Desktop/Apple/MacPro6/MacPro6%2C1
releases:
