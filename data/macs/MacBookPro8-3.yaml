identifier: MacBookPro8,3
line: macbook-pro
efi: 64
board_ids: [Mac-942459F5819B171B]
research_notes: |
  Quad-core Sandy Bridge with two GPUs: Intel HD Graphics 3000 and a discrete AMD Radeon (TeraScale 2, radeon driver), switched through a hardware mux.
  Last 17-inch MacBook Pro: ExpressCard/34 slot, no SD card slot.
  Sandy Bridge with Thunderbolt (Light Ridge). FaceTime HD camera is USB (05ac:8509). Audio is a Cirrus Logic CS4206 codec on every observed machine.
