identifier: iMac19,1
line: imac
efi: 64
board_ids: [Mac-AA95B1DDAB278B95]
research_notes: |
  Audio is a Cirrus Logic CS8409 codec; on many observed machines Linux fell back to the generic HDA parser, so audio needs attention in testing.
  No T2 chip, but the Wi-Fi/Bluetooth is the same BCM4364 used in T2 Macs.
