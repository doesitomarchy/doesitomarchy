identifier: MacBook2,1
line: macbook
efi: 32
board_ids: [Mac-F4208CA9, Mac-F4208CAA]
research_notes: |
  64-bit Core 2 Duo CPU with 32-bit EFI firmware: the stock installer needs a 32-bit EFI boot shim. GMA 950 has no modern OpenGL, so Hyprland will likely use software rendering.
  The iSight reports "no firmware loaded" and needs firmware extracted from macOS.
