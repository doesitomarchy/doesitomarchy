identifier: MacBookPro6,1
line: macbook-pro
efi: 64
board_ids: [Mac-F22589C8]
research_notes: |
  Arrandale Core i5/i7 with two GPUs: Intel HD Graphics in the CPU package and a discrete GeForce GT 330M. Switching is automatic in macOS through a hardware mux.
  Mini DisplayPort carries audio. Audio is a Cirrus Logic CS4206 codec on every observed machine.
  MC846LL/A (2.8 GHz, October 2010) is a speed bump filed under Mid 2010.
sources:
  - https://support.apple.com/en-us/108052
  - https://everymac.com/systems/apple/macbook_pro/specs/macbook-pro-core-i5-2.53-aluminum-17-mid-2010-unibody-specs.html
  - https://everymac.com/systems/apple/macbook_pro/specs/macbook-pro-core-i7-2.66-aluminum-17-mid-2010-unibody-specs.html
  - https://everymac.com/systems/apple/macbook_pro/specs/macbook-pro-core-i7-2.8-aluminum-17-mid-2010-unibody-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacBookPro/MBP61.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Notebook/Apple/MacBookPro6/MacBookPro6%2C1
