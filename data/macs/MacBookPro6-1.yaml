        storage: { interface: sata, standard: ["500 GB HDD"] }
        display: { inches: 17, resolution: 1920x1200, panel: "LED glossy or matte" }
        components: [gpu/intel-hd-arrandale, gpu/nvidia-geforce-gt-330m, wifi/broadcom-bcm43224, bluetooth/apple-05ac-8218, firewire/lsi-fw643, ethernet/broadcom-bcm5764m, storage/intel-5-series-mobile-sata, camera/apple-isight-05ac-8507, ir/apple-05ac-8242, input/apple-mb-unibody, audio/cirrus-cs4206]
