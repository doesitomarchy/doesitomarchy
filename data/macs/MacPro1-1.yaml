identifier: MacPro1,1
line: mac-pro
efi: 32
board_ids: [Mac-F4208DC8]
research_notes: |
  Graphics cards are PCIe cards that owners often replace; configurations cover only the cards Apple sold with the machine.
  64-bit Xeon CPUs with 32-bit EFI firmware: the stock installer needs a 32-bit EFI boot shim.
  Many MacPro1,1 machines were flashed with MacPro2,1 firmware; real MacPro2,1 boots mostly report this board ID.
  Audio is a Realtek ALC889A codec on every observed machine.
sources:
  - https://everymac.com/systems/apple/mac_pro/specs/mac-pro-quad-2.0-specs.html
  - https://everymac.com/systems/apple/mac_pro/specs/mac-pro-quad-2.66-specs.html
  - https://everymac.com/systems/apple/mac_pro/specs/mac-pro-quad-3.0-specs.html
  - https://github.com/acidanthera/OpenCorePkg/blob/master/AppleModels/DataBase/MacPro/MP11.yaml
  - https://github.com/linuxhw/LsPCI/tree/master/Desktop/Apple/MacPro1/MacPro1%2C1
  - https://github.com/linuxhw/Dmesg/tree/main/Desktop/Apple/MacPro1/MacPro1%2C1
releases:
  - id: "2006"
    name: "Mac Pro (2006)"
    announced: 2006-08-07
    discontinued: 2008-01-08
    model_numbers: [A1186]
    emc: ["2113"]
    configs:
      - id: macpro1-1-2006-a
        label: "Xeon \u00b7 GeForce 7300 GT"
        order_numbers: [MA356LL/A]
        cpu:
          codename: woodcrest
          standard: [{ model: "Dual Xeon 5150", ghz: 2.66, cores: 4 }]
          bto: [{ model: "Dual Xeon 5130", ghz: 2.0, cores: 4 }, { model: "Dual Xeon 5160", ghz: 3.0, cores: 4 }]
        memory: { type: DDR2-667 FB-DIMM ECC, standard_gb: [1], max_gb: 16 }
        storage: { interface: sata, standard: ["250 GB HDD"], bto: ["500 GB HDD", "750 GB HDD"] }
        components: [gpu/nvidia-geforce-7300-gt, audio/realtek-alc889a, ethernet/intel-80003es2lan, firewire/ti-tsb82aa2, storage/intel-esb2-sata]
        bto_components: [bluetooth/apple-05ac-8206]
        ports: { usb-a-2: 5, firewire-400: 2, firewire-800: 2, ethernet-gbe: 2, dvi: 2, audio-in: 1, audio-in-optical: 1, audio-out: 1, audio-out-optical: 1 }
        features: [builtin-speaker, fan, optical-drive]
        uncertain:
          - field: components.wifi
            note: "AirPort Extreme was an optional card on this model and no Linux probe identifies it, so no Wi-Fi component is listed."
