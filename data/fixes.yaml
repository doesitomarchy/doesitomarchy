# OmaBoot? fixes: changes OmaBoot? makes in its live system, so a live boot
# matches what an installed Omarchy gets, or gets ahead of it. A report lists
# the ones that took effect on the Mac in `fixes`; unknown IDs are rejected.
# Results that ran with a fix still count for the configuration and show
# "with OmaBoot? <name>", linked to its entry on /fixes (/fixes#<id>).
#
#   id        omaboot.<slug>; permanent, since reports reference it
#   name      short: it follows "with OmaBoot? "
#   changes   what it changes, in a sentence or two
#   targets   hardware: which Macs, in words · devices: PCI/USB IDs it acts
#             on, with a subsystem when it checks that too · configs: when
#             it's that narrow · criteria: the results it can change
#   upstream  the fix's source, or the project it's heading to
#   tested_on configurations it was tried on, on real hardware
#   since     the first OmaBoot? build carrying it: a release ("2026.10") or
#             a dev build ("dev <commit>")
#   levels    where in the system it lives, its main level first: each a level
#             (desktop, system, driver-settings, new-driver, driver-patch,
#             kernel or boot-options; pkg/report FixLevels) and what it changes
#             there. Never firmware: OmaBoot? doesn't change it.

- id: omaboot.radeon-imac10-1-panel-clock
  name: radeon panel clock fix
  changes: "Corrects the built-in panel's clock in radeon's in-memory copy of the video BIOS's panel table: the BIOS says 108 MHz, the panel's EDID 138.5 MHz. Without it, the screen splits into distorted parts unless the Mac boots with nomodeset. It never writes the ROM. OmaBoot? Live also boots this Mac with radeon.dpm=0 radeon.pcie_gen2=0 radeon.uvd=0, as the install fix does: with radeon's defaults the GPU locks up under load."
  targets:
    hardware: "The 21.5-inch iMac10,1 with the Radeon HD 4670. It acts only on GPU 1002:9488 with subsystem 106b:00b6 driving a 1920×1080 panel, so every other Mac runs stock radeon."
    devices:
      - { id: "pci:1002:9488", subsystem: "106b:00b6" }
    configs: [imac10-1-21-late-2009-b]
    criteria: [display.native-resolution, graphics.discrete]
  upstream:
    - title: "omarchy-vintage-intel-imac-fix 0d5a406a31 (patches/panel-encoder-combined.patch)"
      url: https://github.com/choyer/omarchy-vintage-intel-imac-fix/commit/0d5a406a31
  tested_on: [imac10-1-21-late-2009-b]
  since: "dev 1d36b14"
  levels:
    - { level: driver-patch, what: "radeon, rebuilt for both kernels" }
    - { level: boot-options, what: "radeon.dpm=0 radeon.pcie_gen2=0 radeon.uvd=0, on the iMac10,1 only" }

- id: omaboot.applesmc-led-container-of
  name: applesmc keyboard backlight fix
  changes: "Fixes an oops while applesmc starts on Macs whose SMC has a keyboard-backlight key: t2linux patch 3001 takes the SMC's data from the backlight's LED device, which doesn't hold it. A one-line container_of fix. With it, fans, the light sensor and the keyboard backlight work in a live boot."
  targets:
    hardware: "Macs without a T2 chip whose SMC has a keyboard-backlight key, booted on OmaBoot?'s T2 kernel (linux-t2), which carries the t2linux applesmc patches. Other Macs load it without harm."
    criteria: [input.keyboard-backlight, input.ambient-light-sensor, thermal.fans]
  upstream:
    - title: t2linux kernel patches
      url: https://github.com/t2linux/linux-t2-patches
  upstream_note: "Not upstream yet: a pull request to t2linux is planned."
  tested_on: [macbookair5-2-mid-2012-a, imac10-1-21-late-2009-b, imac18-3-5k-2017-a]
  since: "dev 1d36b14"
  levels:
    - { level: driver-patch, what: "applesmc, rebuilt for the T2 kernel" }
    - { level: driver-settings, what: "the official live system's applesmc blacklist, removed" }

- id: omaboot.lid-wake-closed-only
  name: lid wake fix
  changes: "Arms the lid's wake only for a sleep that starts with the lid closed. On these Macs the lid's wake is a bit in the embedded controller, set before every sleep, so a sleep that starts with the lid open (Suspend from the menu, an idle suspend) is woken by the lid a few seconds in. A small systemd-sleep hook turns the lid's wake off in /proc/acpi/wakeup for such a sleep and back on after it; a sleep from closing the lid still wakes when it opens. OmaBoot? Live's sleep test naps once with the stock setting and, if the lid woke it, once more with the fix."
  targets:
    hardware: "Mac laptops whose lid wake goes through the embedded controller: the lid's ACPI _PSW sets a wake-on-lid-open bit. Found on the MacBook Air (13-inch, Mid 2012); every other Mac laptop whose ACPI tables were checked has the same pattern (8 models from 2009 to 2019, MacBook Pro and MacBook Air, in public hardware probes). It does nothing on a Mac without a lid, or when the lid is closed."
    criteria: [power.sleep-wake]
  upstream:
    - title: "Omarchy (Apple hardware fixes in install/hardware/apple)"
      url: https://github.com/omacom/omarchy
  upstream_note: "Not upstream yet: a proposal to Omarchy's Apple hardware fixes is planned."
  tested_on: [macbookair5-2-mid-2012-a]
  since: "dev 327b2e3"
  levels:
    - { level: system, what: "omaboot-lid-wake, a systemd-sleep hook" }
